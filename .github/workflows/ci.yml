name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  # The data sets and the address referential are not versioned (Moodle archive),
  # so the tests that need them are skipped here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # One check per workshop. A checker that needs the unversioned data sets
  # reports KO here even when the workshop is done locally, so these checks
  # are informative and never fail the run.
  verifier:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        atelier: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    name: verifier (atelier ${{ matrix.atelier }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verifier -- ${{ matrix.atelier }}
